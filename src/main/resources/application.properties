server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Reject floating-point numbers for integer fields so amounts such as 10.5 are not silently truncated to 10.
spring.jackson.deserialization.accept-float-as-int=false

bank.base-url=${BANK_BASE_URL:http://localhost:8080}
bank.connect-timeout=${BANK_CONNECT_TIMEOUT:2s}
bank.read-timeout=${BANK_READ_TIMEOUT:5s}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.com.checkout.payment.gateway.repository.PaymentsRepository=DEBUG
